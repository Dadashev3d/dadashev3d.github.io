<style>
/* Layout: engineering drawing sheet. Thin frame, dimension-line details, title block (штамп) as the contact footer. */
:root {
  --paper: #eceeec;
  --sheet: #f7f8f6;
  --ink: #16191b;
  --muted: #5d666b;
  --line: #c9cfcf;
  --accent: #2346d8;
  --accent-ink: #ffffff;
  --display: "Unbounded", "Arial Black", sans-serif;
  --body: "Onest", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #111416; --sheet: #171b1e; --ink: #e7ebec; --muted: #929ca1; --line: #2c3337;
  --accent: #7d95ff; --accent-ink: #0d1020; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #111416; --sheet: #171b1e; --ink: #e7ebec; --muted: #929ca1; --line: #2c3337;
  --accent: #7d95ff; --accent-ink: #0d1020; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font: 16px/1.6 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px }
.sheet { max-width: 1180px; margin: 0 auto; background: var(--sheet); border: 1px solid var(--ink); position: relative }
.sheet::before { content: ""; position: absolute; inset: 6px; border: 1px solid var(--line); pointer-events: none }
.wrap { padding: clamp(20px, 4vw, 56px) }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.01em }
p { margin: 0 }
a { color: inherit }
.mono, .label { font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* top bar */
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 14px clamp(20px, 4vw, 56px); border-bottom: 1px solid var(--line) }
.bar > .mono { font-weight: 500; font-size: 13px; color: var(--ink) }
.bar nav { display: flex; gap: 8px; flex-wrap: wrap }
.bar nav a { text-decoration: none; font: 600 15px var(--body); color: var(--ink); padding: 8px 16px;
  border: 1px solid var(--line); transition: background .15s, color .15s, border-color .15s }
.bar nav a:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.lang { display: flex; border: 1px solid var(--ink) }
.lang button { font: 600 13px var(--mono); background: none; border: 0; color: var(--ink); padding: 8px 12px; cursor: pointer }
.lang button:hover { color: var(--accent) }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--sheet) }

/* hero */
.hero { display: grid; grid-template-columns: 1.6fr 1fr; gap: clamp(24px, 4vw, 56px); align-items: end }
.hero > * { min-width: 0 }
.hero > * { min-width: 0 }
.hero h1 { font-size: clamp(28px, 3.9vw, 56px); line-height: 1.04; margin-top: 18px; hyphens: manual }
.hero h1 .role { color: var(--accent); display: inline-block; margin-top: 8px; font-size: 0.66em; line-height: 1.12 }
.lead { font-size: clamp(17px, 1.6vw, 20px); color: var(--muted); max-width: 52ch; margin-top: 22px }
.ctas { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 30px }
.soft { margin-top: 26px; display: grid; gap: 10px; max-width: 640px }
.soft > div { display: grid; grid-template-columns: 128px 1fr; gap: 10px; align-items: baseline }
.soft .label { color: var(--ink) }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chips span { font: 500 13.5px var(--body); padding: 4px 10px; border: 1px solid var(--line); color: var(--ink); background: var(--paper) }
.chips span.main { border-color: var(--accent); color: var(--accent) }
@media (max-width: 520px) { .soft > div { grid-template-columns: 1fr; gap: 6px } }
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 22px; font: 600 15px var(--body);
  text-decoration: none; border: 1px solid var(--ink); background: none; color: var(--ink); cursor: pointer }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn:hover { transform: translateY(-1px) }
.status { display: inline-flex; align-items: center; gap: 8px }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #2fa66a; box-shadow: 0 0 0 4px color-mix(in srgb, #2fa66a 22%, transparent) }

.portrait { position: relative; aspect-ratio: 4/5; max-width: 100% }

/* placeholder frame for any missing image */
.ph { position: relative; width: 100%; height: 100%; border: 1px dashed var(--muted); display: grid; place-items: center; overflow: hidden;
  background:
    linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 24px 24px,
    linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 24px 24px; }
.ph::before, .ph::after { content: ""; position: absolute; background: var(--muted); opacity: .5 }
.ph::before { width: 1px; height: 100%; left: 50% } .ph::after { height: 1px; width: 100%; top: 50% }
.ph span { position: relative; z-index: 1; background: var(--sheet); padding: 6px 10px; font: 12px var(--mono); color: var(--muted); text-align: center; max-width: 80% }
.media img { width: 100%; height: 100%; object-fit: cover; display: block }

/* specs strip */
.specs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line) }
.specs div { padding: 20px clamp(20px, 4vw, 56px); border-right: 1px solid var(--line); min-width: 0 }
.specs div:last-child { border-right: 0 }
.specs b { display: block; font: 700 22px var(--display); margin-top: 4px }

section { padding-block: clamp(40px, 6vw, 80px) }
section + section { border-top: 1px solid var(--line) }
.head { display: flex; justify-content: space-between; align-items: end; gap: 20px; flex-wrap: wrap; margin-bottom: 32px }
.head h2 { font-size: clamp(26px, 3.4vw, 40px) }

/* filters + works */
.filters { display: flex; gap: 8px; flex-wrap: wrap }
.filters button { font: 500 13px var(--body); padding: 8px 14px; border: 1px solid var(--line); background: none; color: var(--ink); cursor: pointer }
.filters button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--sheet) }
.works { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px 24px }
.work { min-width: 0; display: flex; flex-direction: column; gap: 12px }
.work .media { aspect-ratio: 4/3 }
.work.wide { grid-column: span 2 } .work.wide .media { aspect-ratio: 16/9 }
.work.tall .media { aspect-ratio: 3/4 }
.work.fit .media { background: #fff } .work.fit .media img { object-fit: contain }
.ba { position: relative; overflow: hidden; user-select: none; touch-action: pan-y }
.ba img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block }
.ba .after { clip-path: inset(0 0 0 var(--x, 50%)) }
.ba .bar { position: absolute; top: 0; bottom: 0; left: var(--x, 50%); width: 3px; margin-left: -1.5px; background: #fff; pointer-events: none }
.ba .bar::after { content: "↔"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 38px; height: 38px; border-radius: 50%; background: #fff; color: var(--accent); font: 700 18px/38px var(--body); text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.25) }
.ba .tag { position: absolute; top: 12px; font: 600 12px var(--body); letter-spacing: .04em; text-transform: uppercase; padding: 5px 10px; border-radius: 99px; background: var(--accent); color: #fff; pointer-events: none }
.ba .tag.l { left: 12px } .ba .tag.r { right: 12px }
.ba input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0 }
.work .file { font: 500 13px var(--mono); color: var(--ink); text-underline-offset: 3px; align-self: start }
.work .meta { display: flex; justify-content: space-between; gap: 12px }
.work h3 { font-size: 17px; line-height: 1.3 }
.work p { color: var(--muted); font-size: 14.5px }
.tags { display: flex; gap: 6px; flex-wrap: wrap }
.tags span { font: 11px var(--mono); padding: 3px 7px; border: 1px solid var(--line); color: var(--muted) }

/* services */
.services { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line) }
.svc { padding: 28px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; min-width: 0 }
.svc:last-child { border-right: 0 }
.svc h3 { font-size: 20px }
.svc ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 15px }
.svc li { padding-left: 18px; position: relative }
.svc li::before { content: ""; position: absolute; left: 0; top: 0.75em; width: 9px; height: 1px; background: var(--accent) }
.price { margin-top: auto; padding-top: 16px; border-top: 1px dashed var(--line); display: flex; flex-direction: column; gap: 6px }
.price b { font: 700 24px var(--display); font-variant-numeric: tabular-nums; white-space: nowrap }

/* process */
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; counter-reset: s }
.step { padding: 0 18px 0 0; min-width: 0 }
.step .n { font: 500 12px var(--mono); color: var(--accent); display: flex; align-items: center; gap: 8px; margin-bottom: 12px }
.step .n::after { content: ""; flex: 1; height: 1px; background: var(--line) }
.step h3 { font: 600 16px var(--body); margin-bottom: 6px }
.step p { font-size: 14.5px; color: var(--muted) }

/* formats + guarantees */
.two { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(24px, 4vw, 56px) }
.two > * { min-width: 0 }
.two h3 { font-size: 20px; margin-bottom: 18px }
.formats { display: flex; flex-wrap: wrap; gap: 8px }
.formats span { font: 500 14px var(--mono); padding: 8px 12px; border: 1px solid var(--ink) }
.formats small { display: block; font: 11px var(--body); color: var(--muted); text-transform: none; letter-spacing: 0 }
.tools { margin-top: 22px; color: var(--muted); font-size: 15px }
.guar { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none }
.guar li { display: grid; grid-template-columns: 28px 1fr; gap: 10px }
.guar li::before { content: "✓"; font: 600 15px var(--mono); color: var(--accent) }

/* title block footer */
.stamp { display: grid; grid-template-columns: 1.3fr 1.5fr 0.8fr; border-top: 1px solid var(--ink) }
.stamp > div { padding: 18px clamp(16px, 2.5vw, 28px); border-right: 1px solid var(--ink); min-width: 0 }
.stamp > div:last-child { border-right: 0 }
.stamp h2 { font-size: clamp(22px, 2.6vw, 30px); margin-top: 6px }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-block: 10px; border-bottom: 1px solid var(--line); font-size: 15px; flex-wrap: wrap }
.row > .label { font-size: 13px; font-weight: 500; color: var(--ink) }
.row:last-child { border-bottom: 0 }
.row .v { font: 600 16px var(--body); color: var(--accent); word-break: break-all }
.row a.v { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px }
.row a.v:hover { text-decoration-thickness: 2px }
.copy { font: 600 12px var(--mono); border: 1px solid var(--accent); background: none; color: var(--accent); padding: 4px 10px; cursor: pointer; margin-left: 10px }
.copy:hover { background: var(--accent); color: var(--accent-ink) }

@media (max-width: 900px) {
  .hero, .two { grid-template-columns: 1fr }
  .portrait { max-width: 360px }
  .works { grid-template-columns: 1fr 1fr } .work.wide { grid-column: span 2 }
  .services { grid-template-columns: 1fr } .svc { border-right: 0; border-bottom: 1px solid var(--line) } .svc:last-child { border-bottom: 0 }
  .steps { grid-template-columns: 1fr 1fr; gap: 24px } .specs { grid-template-columns: 1fr 1fr }
  .specs div:nth-child(2) { border-right: 0 } .specs div:nth-child(-n+2) { border-bottom: 1px solid var(--line) }
  .stamp { grid-template-columns: 1fr } .stamp > div { border-right: 0; border-bottom: 1px solid var(--ink) } .stamp > div:last-child { border-bottom: 0 }
}
@media (max-width: 560px) {
  .works { grid-template-columns: 1fr } .work.wide { grid-column: auto } .work.wide .media { aspect-ratio: 4/3 }
  .steps { grid-template-columns: 1fr } .bar nav { display: none }
}
@media (prefers-reduced-motion: reduce) { .btn:hover { transform: none } }
</style>

const FORMATS = [["STEP", "CAD"], ["STL", "3D print"], ["F3D", "Fusion"], ["DWG/PDF", "drawings"], ["PNG 4K", "renders"], ["TIFF/JPG", "photo"]];

let lang = "ru", filter = "all";
try { lang = localStorage.getItem("lang") || "ru" } catch (e) {}

function media(el, src, alt) {
  el.innerHTML = "";
  const img = new Image();
  img.alt = alt; img.loading = "lazy";
  img.onerror = () => { el.innerHTML = `<div class="ph"><span>${T[lang].noImg}${src}</span></div>` };
  img.src = src;
  el.appendChild(img);
}

function beforeAfter(el, w) {
  el.classList.add("ba");
  el.innerHTML = `<img src="${w.ba[0]}" alt="${T[lang].before}: ${w.t[lang]}" loading="lazy">` +
    `<img class="after" src="${w.ba[1]}" alt="${T[lang].after}: ${w.t[lang]}" loading="lazy">` +
    `<span class="bar"></span><span class="tag l">${T[lang].before}</span><span class="tag r">${T[lang].after}</span>` +
    `<input type="range" min="0" max="100" value="50" aria-label="${T[lang].before} / ${T[lang].after}">`;
  el.querySelector("input").addEventListener("input", e => el.style.setProperty("--x", e.target.value + "%"));
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(n => n.textContent = t[n.dataset.t]);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.getElementById("name").textContent = CONFIG.name[lang];
  document.getElementById("stName").textContent = CONFIG.name[lang];
  document.getElementById("stYear").textContent = new Date().getFullYear();
  media(document.getElementById("photo"), CONFIG.photo, CONFIG.name[lang]);

  document.getElementById("soft").innerHTML = CONFIG.software.map(g =>
    `<div><span class="label">${g.k[lang]}</span><div class="chips">${g.v.map(([n, m]) =>
      `<span${m ? ' class="main"' : ""}>${lang === "en" && n === "КОМПАС-3D" ? "KOMPAS-3D" : n}</span>`).join("")}</div></div>`).join("");
  document.getElementById("specs").innerHTML = CONFIG.specs.map(s =>
    `<div><span class="label">${s.k[lang]}</span><b>${lang === "ru" ? s.v : s.ven}</b></div>`).join("");

  // Show a filter only for categories that have work in them.
  const cats = ["cad", "viz", "photo"].filter(c => CONFIG.works.some(w => w.cat === c));
  if (filter !== "all" && !cats.includes(filter)) filter = "all";
  document.getElementById("filters").innerHTML = (cats.length > 1 ? ["all", ...cats] : []).map(f =>
    `<button id="f-${f}" type="button" data-f="${f}" aria-pressed="${f === filter}">${t[f]}</button>`).join("");

  const grid = document.getElementById("worksGrid");
  grid.innerHTML = "";
  CONFIG.works.filter(w => filter === "all" || w.cat === filter).forEach(w => {
    const a = document.createElement("article");
    a.className = "work" + (w.wide && filter === "all" ? " wide" : "") + (w.tall ? " tall" : "") + (w.fit ? " fit" : "");
    a.innerHTML = `<div class="media"></div>
      <div class="meta"><h3>${w.t[lang]}</h3><span class="label">${t[w.cat]}</span></div>
      <p>${w.d[lang]}</p><div class="tags">${w.tags.map(x => `<span>${x}</span>`).join("")}</div>` +
      (w.file ? `<a class="file" href="${w.file.href}" target="_blank" rel="noopener">${w.file[lang]} ↗</a>` : "");
    grid.appendChild(a);
    if (w.ba) beforeAfter(a.querySelector(".media"), w); else media(a.querySelector(".media"), w.img, w.t[lang]);
  });

  document.getElementById("svcGrid").innerHTML = CONFIG.services.map(s =>
    `<div class="svc"><h3>${s.t[lang]}</h3><ul>${s.li[lang].map(x => `<li>${x}</li>`).join("")}</ul>
     <div class="price"><b>${s.price[lang]}</b><span class="label">${s.unit[lang]}</span></div></div>`).join("");

  document.getElementById("steps").innerHTML = t.steps.map((s, i) =>
    `<div class="step"><div class="n">${String(i + 1).padStart(2, "0")}</div><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join("");

  document.getElementById("formats").innerHTML = FORMATS.map(f => `<span>${f[0]}<small>${f[1]}</small></span>`).join("");
  document.getElementById("guar").innerHTML = t.guar.map(g => `<li>${g}</li>`).join("");

  document.getElementById("contacts").innerHTML = CONFIG.contacts.map((c, i) =>
    `<div class="row"><span class="label">${c.label}</span><span>${c.url
      ? `<a class="v" id="c${i}" href="${c.url}" target="_blank" rel="noopener">${c.value}</a>`
      : `<span class="v" id="c${i}">${c.value}</span>`}<button class="copy" type="button" data-i="${i}">${t.copy}</button></span></div>`).join("");
}

document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.lang) { lang = b.dataset.lang; try { localStorage.setItem("lang", lang) } catch (x) {} render() }
  else if (b.dataset.f) { filter = b.dataset.f; render() }
  else if (b.classList.contains("copy")) {
    const el = document.getElementById("c" + b.dataset.i);
    const done = () => { b.textContent = T[lang].copied; setTimeout(() => b.textContent = T[lang].copy, 1500) };
    navigator.clipboard.writeText(el.textContent).then(done).catch(() => {
      const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    });
  }
});

render();
</script>
